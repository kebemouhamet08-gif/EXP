name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall .
      - name: Run tests with coverage
        run: python -m pytest -W error -vv --cov=app --cov-report=term-missing --cov-report=xml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: classexp
          POSTGRES_PASSWORD: classexp_test
          POSTGRES_DB: classexp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classexp -d classexp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://classexp:classexp_test@127.0.0.1:5432/classexp_test
      CLASSEXP_TEST_DATABASE_URL: postgresql+psycopg://classexp:classexp_test@127.0.0.1:5432/classexp_test
      CLASSEXP_ENV: test
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Run suite against PostgreSQL
        run: python -m pytest -W error -vv
