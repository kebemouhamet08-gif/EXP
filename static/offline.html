<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Hors connexion · ClasseXP</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; margin: 0; padding: 1.25rem; color: #f3f6ff; background: radial-gradient(circle at 70% 0, #162b58, transparent 35rem), #0b1020; }
    main { width: min(100%, 34rem); padding: clamp(1.5rem, 5vw, 2.5rem); border: 1px solid rgba(130,170,255,.22); border-radius: 1rem; background: rgba(14,28,52,.9); box-shadow: 0 24px 60px rgba(0,0,0,.3); }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.8rem, 7vw, 2.5rem); }
    p { margin: 0 0 1.4rem; color: #a7b4cf; line-height: 1.6; }
    button { min-height: 2.8rem; padding: .7rem 1.1rem; border: 0; border-radius: .7rem; color: white; background: linear-gradient(105deg, #45a9ff, #6a4cff); font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #9bc5ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors connexion.</h1>
    <p>Une connexion Internet est nécessaire pour accéder à vos données ClasseXP.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
