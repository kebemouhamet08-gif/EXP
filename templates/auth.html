<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClasseXP - {{ 'Connexion' if mode == 'connexion' else 'Inscription' }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; min-height: 100vh; display: grid; place-items: center; }
        main { width: min(92vw, 420px); background: #313244; padding: 2rem; border-radius: 12px; }
        h1 { color: #89b4fa; } label { display: block; margin-top: 1rem; }
        input, select, button { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .4rem; border-radius: 6px; border: 1px solid #585b70; }
        button { margin-top: 1.5rem; background: #a6e3a1; border: 0; font-weight: bold; cursor: pointer; }
        .error { color: #f38ba8; } a { color: #89b4fa; }
    </style>
</head>
<body>
<main>
    <h1>ClasseXP</h1>
    <h2>{{ 'Connexion' if mode == 'connexion' else 'Creer un compte' }}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% if mode == 'inscription' %}
        <label>Nom<input name="nom" required></label>
        <label>Role<select name="role"><option value="ELEVE">Eleve</option><option value="PROFESSEUR">Professeur</option></select></label>
        {% endif %}
        <label>Email<input type="email" name="email" required></label>
        <label>Mot de passe<input type="password" name="mot_de_passe" minlength="8" required></label>
        <button type="submit">{{ 'Se connecter' if mode == 'connexion' else 'S inscrire' }}</button>
    </form>
    <p><a href="{{ url_for('inscription' if mode == 'connexion' else 'connexion') }}">{{ 'Creer un compte' if mode == 'connexion' else 'J ai deja un compte' }}</a></p>
</main>
</body>
</html>
