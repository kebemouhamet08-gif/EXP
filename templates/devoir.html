<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClasseXP - {{ devoir['titre'] }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; }
        main { width: min(92vw, 650px); margin: 3rem auto; background: #313244; padding: 2rem; border-radius: 12px; }
        #chrono { text-align: center; color: #f38ba8; font: bold 3rem monospace; margin: 2rem 0; } input, button { padding: .75rem; border-radius: 6px; } button { background: #a6e3a1; border: 0; font-weight: bold; cursor: pointer; } a { color: #89b4fa; }
    </style>
</head>
<body><main>
    <p><a href="{{ url_for('dashboard_eleve') }}">Retour au tableau de bord</a></p><h1>{{ devoir['titre'] }}</h1><p>{{ devoir['description'] }}</p>
    <div id="chrono" aria-live="polite"></div>
    <p><a href="{{ url_for('telecharger_fichier', nom_fichier='sujets/' ~ devoir['sujet_pdf']) }}" target="_blank">Consulter le sujet</a></p>
    <form action="{{ url_for('rendre_copie') }}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="devoir_id" value="{{ devoir['id'] }}"><label>Déposer ma copie <input type="file" name="copie" accept=".pdf,.docx,.jpg,.png" required></label><button type="submit">Rendre le devoir</button>
    </form>
    <script>
        let restant = {{ restant }}; const chrono = document.getElementById('chrono'); const bouton = document.querySelector('button');
        function actualiser() { const heures = Math.floor(restant / 3600); const minutes = Math.floor((restant % 3600) / 60); const secondes = restant % 60; chrono.textContent = [heures, minutes, secondes].map(v => String(v).padStart(2, '0')).join(':'); if (restant <= 0) { bouton.disabled = true; return; } restant -= 1; setTimeout(actualiser, 1000); }
        actualiser();
    </script>
</main></body>
</html>
