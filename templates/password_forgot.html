{% extends "base.html" %}
{% block title %}Mot de passe oublié · ClasseXP{% endblock %}
{% block public_content %}
<section class="auth-layout">
  <div class="card auth-card">
    <div class="auth-card-heading">
      <p class="eyebrow">ClasseXP</p>
      <h2>Mot de passe oublié</h2>
      <p>Indiquez votre adresse email pour recevoir la procédure de réinitialisation.</p>
    </div>
    <form method="post" class="form-stack" data-action-feedback>
      <div class="form-field">
        <label class="form-label" for="email">Adresse e-mail</label>
        <input class="form-input" id="email" type="email" name="email" autocomplete="email" required value="{{ email or '' }}">
      </div>
      <button class="button button-primary button-block" type="submit">Réinitialiser le mot de passe</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('connexion') }}">Retour à la connexion</a></p>
  </div>
</section>
{% endblock %}
