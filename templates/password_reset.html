{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe · ClasseXP{% endblock %}
{% block public_content %}
<section class="auth-layout">
  <div class="card auth-card">
    <div class="auth-card-heading">
      <p class="eyebrow">ClasseXP</p>
      <h2>Réinitialiser le mot de passe</h2>
      <p>Choisissez un nouveau mot de passe pour sécuriser votre compte.</p>
    </div>
    <form method="post" class="form-stack" data-action-feedback>
      <input type="hidden" name="token" value="{{ token or '' }}">
      <div class="form-field">
        <label class="form-label" for="mot_de_passe">Nouveau mot de passe</label>
        <input class="form-input" id="mot_de_passe" type="password" name="mot_de_passe" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="mot_de_passe_confirm">Confirmation</label>
        <input class="form-input" id="mot_de_passe_confirm" type="password" name="mot_de_passe_confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="button button-primary button-block" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('connexion') }}">Retour à la connexion</a></p>
  </div>
</section>
{% endblock %}
